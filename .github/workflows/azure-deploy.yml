# Deploy Nordic OpenWA fork -> Azure ACR + Container Apps
#
# Builds THIS fork with Docker Buildx (OpenWA Dockerfile uses BUILDPLATFORM;
# `az acr build` dependency scan cannot parse that syntax).
#
# Required GitHub secrets (NordicDesignHouse/OpenWA):
#   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
#   OPENWA_API_MASTER_KEY  (>=32 chars
#
# Optional Variables: ACR_NAME, ACR_RG, OPENWA_RG, OPENWA_APP

name: Azure deploy OpenWA

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:
    inputs:
      skip_build:
        description: "Skip image build (redeploy openwa:latest only)"
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

env:
  ACR_NAME: ${{ vars.ACR_NAME || 'bdsqmsacr' }}
  ACR_RG: ${{ vars.ACR_RG || 'bds-qms' }}
  OPENWA_RG: ${{ vars.OPENWA_RG || 'nordic-openwa' }}
  OPENWA_APP: ${{ vars.OPENWA_APP || 'openwa-api' }}
  IMAGE_NAME: openwa

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: ACR credentials
        id: acr
        run: |
          LOGIN_SERVER=$(az acr show -n "$ACR_NAME" -g "$ACR_RG" --query loginServer -o tsv)
          USER=$(az acr credential show -n "$ACR_NAME" -g "$ACR_RG" --query username -o tsv)
          PASS=$(az acr credential show -n "$ACR_NAME" -g "$ACR_RG" --query 'passwords[0].value' -o tsv)
          echo "login_server=$LOGIN_SERVER" >> "$GITHUB_OUTPUT"
          echo "username=$USER" >> "$GITHUB_OUTPUT"
          echo "::add-mask::$PASS"
          echo "password=$PASS" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.skip_build == false }}
        uses: docker/setup-buildx-action@v3

      - name: Login to ACR
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.skip_build == false }}
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.acr.outputs.login_server }}
          username: ${{ steps.acr.outputs.username }}
          password: ${{ steps.acr.outputs.password }}

      - name: Build and push fork image
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.skip_build == false }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.acr.outputs.login_server }}/${{ env.IMAGE_NAME }}:latest
            ${{ steps.acr.outputs.login_server }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy Container App
        env:
          API_MASTER_KEY: ${{ secrets.OPENWA_API_MASTER_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${API_MASTER_KEY:-}" || ${#API_MASTER_KEY} -lt 32 ]]; then
            echo "OPENWA_API_MASTER_KEY secret missing or < 32 chars" >&2
            exit 1
          fi

          IMAGE="${{ steps.acr.outputs.login_server }}/${IMAGE_NAME}:latest"
          ACR_USER="${{ steps.acr.outputs.username }}"
          ACR_PASS="${{ steps.acr.outputs.password }}"

          az containerapp secret set \
            --name "$OPENWA_APP" \
            --resource-group "$OPENWA_RG" \
            --secrets "acr-password=${ACR_PASS}" "api-master-key=${API_MASTER_KEY}" \
            --output none

          az containerapp registry set \
            --name "$OPENWA_APP" \
            --resource-group "$OPENWA_RG" \
            --server "${{ steps.acr.outputs.login_server }}" \
            --username "$ACR_USER" \
            --password "$ACR_PASS" \
            --output none

          az containerapp update \
            --name "$OPENWA_APP" \
            --resource-group "$OPENWA_RG" \
            --image "$IMAGE" \
            --set-env-vars \
              "ENGINE_TYPE=baileys" \
              "ALLOW_DEV_API_KEY=false" \
              "AUTO_START_SESSIONS=true" \
              "NODE_ENV=production" \
              "API_MASTER_KEY=secretref:api-master-key" \
            --cpu 0.75 \
            --memory 1.5Gi \
            --min-replicas 1 \
            --max-replicas 1 \
            --output none

          FQDN=$(az containerapp show -n "$OPENWA_APP" -g "$OPENWA_RG" \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          echo "### OpenWA" >> "$GITHUB_STEP_SUMMARY"
          echo "https://${FQDN}" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke health
        run: |
          FQDN=$(az containerapp show -n "$OPENWA_APP" -g "$OPENWA_RG" \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          URL="https://${FQDN}"
          for i in $(seq 1 12); do
            CODE=$(curl -sS -m 20 -o /tmp/h.json -w '%{http_code}' "$URL/api/health/live" || echo 000)
            echo "attempt $i -> HTTP $CODE"
            if [[ "$CODE" == "200" || "$CODE" == "401" || "$CODE" == "403" ]]; then
              exit 0
            fi
            sleep 15
          done
          echo "Health still failing; check ACA logs" >&2
          exit 1
